[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subspace-gguf"
version = "0.1.0"
description = "Activation-subspace analysis and llama.cpp mixed-precision GGUF quantization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ankan Deria"}]
dependencies = [
  "accelerate>=0.30",
  "datasets>=2.18",
  "gguf>=0.17",
  "numpy>=1.24",
  "safetensors>=0.4",
  "torch>=2.1",
  "transformers>=4.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
subspace-gguf = "subspace_gguf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
